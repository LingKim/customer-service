server:
  port: 9092

spring:
  application:
    name: yunti-tenant-service
  datasource:
    url: jdbc:postgresql://${YUNTI_DB_HOST:127.0.0.1}:${YUNTI_DB_PORT:5432}/${YUNTI_TENANT_DB:tenant_db}
    username: ${YUNTI_DB_USER:mac}
    password: ${YUNTI_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

yunti:
  id:
    worker-id: ${YUNTI_WORKER_ID:2}
  auth:
    # JWT 签名密钥：与 user-service 保持一致，生产必须通过环境变量覆盖
    jwt-secret: ${YUNTI_JWT_SECRET:yunti-customer-service-jwt-secret-please-change-in-prod-0123456789}
  user:
    # user-service 内部接口地址（审核通过后回填 sys_user.tenant_code）
    internal-base-url: ${YUNTI_USER_INTERNAL_URL:http://127.0.0.1:9091}
  demo:
    # 本地演示：企业用户可在引导页一键模拟审核通过；生产必须置 false
    approve-enabled: ${YUNTI_DEMO_APPROVE_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input
