server:
  port: 9090

spring:
  application:
    name: yunti-gateway

  # 强制使用 Reactive 容器（Netty），避免与 MVC 容器冲突
  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          # 声明式路由：按前缀转发到各业务服务（生产可替换为注册中心 lb://service-id）
          routes:
            - id: yunti-user-service
              uri: ${YUNTI_USER_SERVICE_URL:http://127.0.0.1:9091}
              predicates:
                - Path=/api/user/**
            - id: yunti-tenant-service
              uri: ${YUNTI_TENANT_SERVICE_URL:http://127.0.0.1:9092}
              predicates:
                - Path=/api/tenant/**
            # 平台侧接口（目前是"支持工单"）：也是 customer-service 提供的，
            # 但按"平台视角"单独开一条前缀，方便以后给平台接口统一加鉴权/限流
            - id: yunti-platform-api
              uri: ${YUNTI_CUSTOMER_SERVICE_URL:http://127.0.0.1:9093}
              predicates:
                - Path=/api/platform/**
            - id: yunti-customer-service
              uri: ${YUNTI_CUSTOMER_SERVICE_URL:http://127.0.0.1:9093}
              predicates:
                - Path=/api/customer/**
            - id: yunti-billing-service
              uri: ${YUNTI_BILLING_SERVICE_URL:http://127.0.0.1:9094}
              predicates:
                - Path=/api/billing/**
            - id: yunti-ops-service
              uri: ${YUNTI_OPS_SERVICE_URL:http://127.0.0.1:9095}
              predicates:
                - Path=/api/ops/**
            - id: yunti-ai-service
              uri: ${YUNTI_AI_SERVICE_URL:http://127.0.0.1:9100}
              predicates:
                - Path=/api/ai/**
            - id: yunti-realtime-service
              uri: ${YUNTI_REALTIME_SERVICE_URL:http://127.0.0.1:9096}
              predicates:
                - Path=/api/realtime/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
