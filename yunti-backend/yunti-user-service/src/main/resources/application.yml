server:
  port: 9091

spring:
  application:
    name: yunti-user-service
  datasource:
    url: jdbc:postgresql://${YUNTI_DB_HOST:127.0.0.1}:${YUNTI_DB_PORT:5432}/${YUNTI_USER_DB:user_db}
    username: ${YUNTI_DB_USER:mac}
    password: ${YUNTI_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

yunti:
  id:
    worker-id: ${YUNTI_WORKER_ID:1}
  auth:
    # JWT 签名密钥：生产环境必须通过环境变量覆盖，长度不小于 32 字节
    jwt-secret: ${YUNTI_JWT_SECRET:yunti-customer-service-jwt-secret-please-change-in-prod-0123456789}
    # token 有效期（秒），默认 2 小时
    jwt-expire-seconds: ${YUNTI_JWT_EXPIRE_SECONDS:7200}
    # 验证码调试模式：仅本地联调时返回明文 code，生产必须置 false
    captcha-debug: ${YUNTI_CAPTCHA_DEBUG:true}
  tenant:
    # 租户服务内部接口地址（企业资料落库）
    internal-base-url: ${YUNTI_TENANT_INTERNAL_URL:http://127.0.0.1:9092}
  mail:
    enabled: ${YUNTI_MAIL_ENABLED:}
    host: ${YUNTI_MAIL_HOST:smtp.163.com}
    port: ${YUNTI_MAIL_PORT:465}
    username: ${YUNTI_MAIL_USERNAME:}
    password: ${YUNTI_MAIL_PASSWORD:}
    from-name: 云梯智能客服
    from-address: ${YUNTI_MAIL_FROM_ADDRESS:}
  member-invite:
    frontend-url: ${YUNTI_MEMBER_FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: input
